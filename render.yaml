services:
  - type: web
    name: nexus-chat-free
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_DATABASE_URL
        value: libsql://nexus-thedragon8592.aws-us-east-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
